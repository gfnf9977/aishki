<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI & Tech Toolbox</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <button class="top-export-btn" onclick="exportDataToJson()" title="Завантажити бекап (JSON)">
        📥 Експорт
    </button>

    <header>
        <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn" title="Перемкнути тему">🌙</button>
        <h1>AI & Tech Toolbox</h1>
        <p>Твій преміальний цифровий арсенал</p>
    </header>

    <div class="controls-wrapper">
        <input type="text" id="toolSearch" placeholder="Знайти інструмент (напр. 'Figma', 'OSINT')..." autocomplete="off">
        <div class="filter-checkbox-group" id="filterMonetization">
            <label><input type="checkbox" value="free" checked> 🟢 Free / OS</label>
            <label><input type="checkbox" value="freemium" checked> 🎁 Freemium</label>
            <label><input type="checkbox" value="paid" checked> 🔴 Paid</label>
        </div>
        <select id="filterUsed" class="filter-select">
            <option value="all">🛠️ Усі статуси</option>
            <option value="tested">✓ Протестовані</option>
            <option value="untested">○ Не тестовані</option>
        </select>
    </div>

    <nav class="categories-nav" id="categoriesNav"></nav>
    <main class="container" id="toolsContainer"></main>

    <div class="fab-container">
        <div class="fab-tooltip hint-anim">Підібрати інструмент?</div>
        <button class="ai-fab" onclick="toggleAiWidget()" title="Запитати ШІ">✨</button>
    </div>

    <div class="ai-chat-window" id="aiChatWindow">
        <div class="ai-chat-header">
            <h3>✨ ШІ-Консьєрж</h3>
            <button class="ai-close-btn" onclick="toggleAiWidget()">✕</button>
        </div>
        <div class="ai-chat-body">
            <div class="ai-modes">
                <label class="ai-mode-label"><input type="radio" name="aiMode" value="global" checked> <span>🌍 Найкращі всюди</span></label>
                <label class="ai-mode-label"><input type="radio" name="aiMode" value="local"> <span>📁 Тільки наявні в базі</span></label>
                <label class="ai-mode-label"><input type="radio" name="aiMode" value="exclude"> <span>🚫 Знайти нове (Уникати бази)</span></label>
            </div>
            <textarea id="taskInput" placeholder="Опишіть задачу, і я підберу інструмент..."></textarea>
            <div class="ai-buttons">
                <button onclick="analyzeTask()" class="btn-ai btn-ai-primary">Знайти</button>
                <button onclick="clearAssistant()" class="btn-ai btn-ai-secondary">Очистити</button>
            </div>
            <div id="aiResponse"></div>
        </div>
    </div>

    <div id="addToolModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2>✨ Додати інструмент</h2>
                <button class="close-modal" onclick="toggleAddModal()">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Назва *</label>
                    <input type="text" id="newToolName" placeholder="Напр. Figma">
                </div>
                
                <div class="form-group">
                    <label>Посилання (URL) *</label>
                    <input type="url" id="newToolUrl" placeholder="https://...">
                </div>

                <div class="form-group">
                    <label>URL Картинки (опціонально)</label>
                    <input type="url" id="newToolImage" placeholder="https://...">
                </div>

                <div class="form-group">
                    <label>Опис *</label>
                    <textarea id="newToolDesc" placeholder="Коротко, що це таке..."></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Монетизація</label>
                        <select id="newToolMonetization">
                            <option value="🆓 Free">🆓 Free</option>
                            <option value="🎁 Freemium">🎁 Freemium</option>
                            <option value="🔴 Paid">🔴 Paid</option>
                            <option value="🌍 Open Source">🌍 Open Source</option>
                        </select>
                    </div>
                    
                    <div class="form-group checkbox-group">
                        <label class="custom-checkbox">
                            <input type="checkbox" id="newToolIsOwn">
                            <span>🚀 Це моя власна розробка</span>
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label>Категорії</label>
                    <div class="categories-selector" id="modalCategoriesList">
                    </div>
                    <div class="add-new-category">
                        <input type="text" id="newCategoryInput" placeholder="Нова категорія...">
                        <button type="button" onclick="addNewCategoryToSelection()">+</button>
                    </div>
                </div>

                <button class="btn-submit-tool" onclick="saveNewTool()">Зберегти в базу</button>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/main.js"></script>
</body>
</html>
